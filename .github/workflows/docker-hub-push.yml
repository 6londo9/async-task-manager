name: Dockerhub push

on:
  push:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set JDK version
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn clean compile
  liquibase:
    runs-on: ubuntu-latest
    needs: compile
    services:
      postgres-db:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: github_actions
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Liquibase
        uses: liquibase/setup-liquibase@v3
        with:
          version: '5.0.3'
          edition: 'community'
      - name: Install Database Driver
        run: liquibase lpm add postgresql --global
      - name: Lint and Validate Scripts
        env:
          LIQUIBASE_COMMAND_URL: jdbc:postgresql://localhost:5432/github_actions
          LIQUIBASE_COMMAND_USERNAME: user
          LIQUIBASE_COMMAND_PASSWORD: password
          LIQUIBASE_COMMAND_CHANGELOG_FILE: src/main/resources/db/changelog/db.changelog-master.xml
        run: liquibase update
  test:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set JDK version
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Tests
        run: mvn clean test
  push-to-dockerhub:
    runs-on: ubuntu-latest
    needs: [test, liquibase]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set JDK version
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Image
        run: mvn package jib:build -Pbuild-docker-image

