spring:
  application:
    name: asyncTaskManager
  datasource:
    url: jdbc:postgresql://postgres:5432/tasksdb
    username: user
    password: password
    hikari:
      # Основные настройки пула
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000  # 5 минут
      connection-timeout: 20000  # 20 секунд
      max-lifetime: 1200000  # 20 минут

      # Настройки производительности
      auto-commit: false
      validation-timeout: 5000
      leak-detection-threshold: 60000

      # Настройки для оптимистичной блокировки
      transaction-isolation: TRANSACTION_READ_COMMITTED

      # Метрики и мониторинг
      register-mbeans: true
      pool-name: TaskServicePool
  jpa:
    #    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
  data:
    redis:
      host: redis
      port: 6379
      password: password
      timeout: 5000ms
  kafka:
    bootstrap-servers: kafka:9092
    streams:
      application-id: asyncTaskManagerCdcTransformer
  profiles:
    active: tests
worker:
  pool:
    size: 9
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  stall-wait-time:
    tasks: 15 # Stored in minutes
    notifications: 5 # Stored in minutes
  retry-count:
    tasks: 3
    notification-inbox: 3
  schedulers:
    inbox:
      cleanup-cron-time: 0 0 0 1 */2 * # Runs every two months
  redis:
    notification-inbox:
      ttl: 60 # Stored in seconds
  kafka:
    topics:
      tasks: tasks
      notifications: notifications
      notifications-cdc: cdc.public.notifications
    tasks:
      consumers:
        group-id: task-group
    notifications:
      consumers:
        group-id: notification-group
  debezium:
    url: 'http://debezium:8083'
    name: 'postgres-cdc-connector'
    config:
      connector:
        class: 'io.debezium.connector.postgresql.PostgresConnector'
      tasks:
        max: '1'
      plugin:
        name: 'pgoutput'
      database:
        hostname: 'postgres'
        port: '5432'
        user: 'user'
        password: 'password'
        dbname: 'tasksdb'
      topic:
        prefix: 'cdc'
      table:
        include:
          list: 'public.notifications'
      snapshot:
        mode: 'no_data'