spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/tasksdb
  data:
    redis:
      host: redis
      port: 6379
      password: password
      timeout: 5000ms
  kafka:
    bootstrap-servers: kafka:9092

logging:
  group:
    app: com.backendDojo.asyncTaskManager
    kafka: org.apache.kafka, org.springframework.kafka
    sql: org.hibernate.SQL, org.hibernate.orm.jdbc.bind
  level:
    root: INFO
    app: INFO
    kafka: INFO
    sql: INFO